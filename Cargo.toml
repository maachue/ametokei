[package]
name = "tty-clock-rs"
version = "0.1.0"
edition = "2024"

license = "MIT"
authors = ["Maachue <maachue.project@outlook.com>", "ckaznable <ckaznable@gmail.com>"]

[dependencies]
# error handling
color-eyre = "0.6.5"
thiserror = "2.0.18" # maybe remove

# time
chrono = { version = "0.4.43", features = ["alloc"] }

# core
clap = "4.5.59"

crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
futures = "0.3.32"
ratatui = { version = "0.30.0", features = ["serde"] }
tokio = { version = "1.49.0", features = ["full"] }

# config
unicode-width = "0.2.2" # for checker
directories = "6.0.0"
toml = "1.0.3"
serde = "1.0.228"

[profile.release]
codegen-units = 3
lto = true
opt-level = 3
strip = true
